<details class="spoiler">
  <summary class="spoiler-summary">
    <span class="spoiler-show">
      {{ with .Get "title" }}{{ . }}{{ else }}答え・ネタバレを表示する{{ end }}
    </span>

    <span class="spoiler-hide">
      表示を隠す
    </span>
  </summary>

  <div class="spoiler-content">
    {{ .Inner | strings.TrimSpace | .Page.RenderString }}
  </div>
</details>
